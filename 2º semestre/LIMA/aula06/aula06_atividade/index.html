<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <h1>Cadastro</h1>

            <p>Preencha os dados abaixo</p>

            <input
                type="text"
                id="nome"
                placeholder="Nome"
            >

            <input
                type="email"
                id="email"
                placeholder="E-mail"
            >

            <input
                type="tel"
                id="telefone"
                placeholder="Telefone"
            >

            <input type="checkbox" id="professor">
            <label for="professor">Professor</label>
            <input type="text" id="materia" placeholder="Matéria" style="display: none">

            <button id="salvar">
                Salvar
            </button>

        </div>

        <div class="card tabela-container">

            <h2>Cadastros</h2>

            <table>

                <thead>

                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                    </tr>

                </thead>

                <tbody id="tabela">

                </tbody>

            </table>

        </div>

         <div class="card tabela-container2">

            <h2>Cadastros Professores</h2>

            <table>

                <thead>

                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Materia</th>
                    </tr>

                </thead>

                <tbody id="tabela2">

                </tbody>

            </table>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
