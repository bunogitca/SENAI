<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 13px; max-width: 440px; }
        label { display: block; font-weight: bold; margin: 10px 0 3px; }
        input, textarea { width: 100%; border: 1px solid #b5b5b5; box-sizing: border-box; }
        input { height: 22px; }
        textarea { height: 150px; }
        p { font-weight: bold; font-size: 11px; margin: 15px 0; }
        button { background: #e0e0e0; border: 1px solid #7f7f9e; padding: 3px 8px; color: #333366; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Preencher Cadastro</h2>
    
    <form>
        <label>Nome:</label>
        <input type="text">
        
        <label>E-mail:</label>
        <input type="email">

        <label>Telefone:</label>
        <input type="number">

        <label>Endereço:</label>
        <input type="text">
        <button type="submit">Salvar</button>
    </form>


</body>
</html>
